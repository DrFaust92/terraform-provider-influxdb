name: Acceptance tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "master"
permissions:
  contents: read
jobs:
  acceptance:
    name: Run acceptance tests (InfluxDB ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.11"
            image: influxdb:1.11@sha256:300a2bb2fd9d66c476c4bd7ca3ce6135d485151cce19b605ef7ab2a000fa1845
          - version: "1.12"
            image: influxdb:1.12@sha256:13ffcbd3d6c2c4c35c747da52f09d54dc340ad55497e74820cbcafeb1d7c237c
    services:
      influxdb:
        image: ${{ matrix.image }}
        ports:
          - 8086:8086
        env:
          # Matches INFLUXDB_USERNAME/INFLUXDB_PASSWORD set by `make testacc`.
          INFLUXDB_HTTP_AUTH_ENABLED: "true"
          INFLUXDB_ADMIN_USER: test
          INFLUXDB_ADMIN_PASSWORD: test
        options: >-
          --health-cmd "curl -sf http://localhost:8086/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"

      - name: Run acceptance tests
        env:
          INFLUXDB_URL: http://localhost:8086/
        run: make testacc
